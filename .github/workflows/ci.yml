name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `tools/probe/drives/loss-warning-partials.ts` decodes
      # assets/reference/loss-audio.m4a, which is AAC in an MP4 container, and
      # shells out to ffmpeg to do it. It is the one drive a clean checkout
      # cannot run, so the decoder is installed here rather than the drive being
      # left to skip: `loss-warning-partials.test.ts` fails instead of skipping
      # when CI is set and ffmpeg is missing.
      #
      # The ubuntu-24.04 runner image does not ship ffmpeg, so this does install
      # it; the guard is there so the step costs nothing if a future image does.
      # `--no-install-recommends` is what keeps it to the decoder rather than to
      # a desktop media stack - nothing here needs the X11 or SDL outputs.
      - name: Ensure ffmpeg for the loss-warning-partials drive
        run: |
          ffmpeg -version >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          }
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Separate from `build` on purpose. `build` is the check that gates a merge, so
  # it stays the thing that must be green and it stays fast. This job measures;
  # it does not gate. Nothing fails the pull request on a coverage number, and
  # the probe drives are wall-clock sensitive, so a slow runner must not be able
  # to turn a coverage measurement into a blocked merge.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same decoder the build job needs, for the same drive.
      - name: Ensure ffmpeg for the loss-warning-partials drive
        run: |
          ffmpeg -version >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          }
      - run: npm run test:coverage
      # coverage/ is gitignored, so the report lives as an artifact rather than
      # in the tree. Download it and put lcov.info where /assess can read it to
      # get coverage figures against the hotspot list.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
