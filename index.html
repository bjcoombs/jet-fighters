<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jet Fighters</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #23262c 0%, #0a0a0b 70%);
        color: #e0e0e0;
        font-family: system-ui, sans-serif;
        overflow: hidden;
        /* The case is letterboxed inside the page by its 1000:460 aspect ratio,
           so there is always bare page around it - and a tap that misses the
           fire button lands there. Without this, iOS Safari reads two quick
           misses as a double-tap and zooms into the display, which is exactly
           what a player firing fast produces. `manipulation` keeps pinch-zoom
           (an accessibility affordance) and drops only double-tap-to-zoom.
           The case itself already sets this; the page around it did not. */
        touch-action: manipulation;
        /* A held fire button is a press-and-hold, which iOS answers with the
           selection callout and magnifier loupe. */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        /* Landscape iOS otherwise rubber-bands the whole page on a swipe that
           starts on the case. */
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
